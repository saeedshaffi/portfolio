<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Components reconstructed from design-system recording</title><link rel="stylesheet" href="video-components.css"><style>body{background:#f1f3f6;margin:0;padding:48px;font-family:system-ui,sans-serif}main{margin:auto;max-width:1100px}h1{font-size:clamp(32px,5vw,64px);letter-spacing:-.04em}</style></head>
<body><main><span class="er-status">✓ Ready to use</span><h1>Component specimens</h1><div class="er-demo-grid">
  <section class="er-card"><h2>Date picker</h2><div class="er-calendar" id="calendar"></div></section>
  <section class="er-card"><h2>Inputs</h2><p class="er-field"><label class="er-label" for="name">Label</label><input class="er-input" id="name" placeholder="Placeholder"><small class="er-help">Optional supporting text</small></p><p class="er-field" data-error="true"><label class="er-label" for="country">Country</label><select class="er-select" id="country"><option>Select an option</option><option>Germany</option><option>Pakistan</option></select><small class="er-error">Please choose an option</small></p></section>
  <section class="er-card"><h2>Selection</h2><p><label class="er-check"><input type="checkbox" checked><span><b>Checkbox label</b><br><small class="er-help">Projected description</small></span></label></p><p><label class="er-switch"><input type="checkbox" checked><span class="er-switch-track"></span><span><b>Switch label</b><br><small class="er-help">Takes effect immediately</small></span></label></p></section>
  <section class="er-card"><h2>Gauge</h2><div class="er-gauge" id="gauge" role="meter"><span class="er-gauge-value">64</span></div></section>
</div></main><script type="module">import{createCalendar,setGauge}from'./video-components.js';createCalendar(document.querySelector('#calendar'),new Date(2026,7,19));setGauge(document.querySelector('#gauge'),64);</script></body></html>
