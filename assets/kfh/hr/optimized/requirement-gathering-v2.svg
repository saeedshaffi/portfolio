<svg xmlns="http://www.w3.org/2000/svg" width="1756" height="1772" viewBox="0 0 1756 1772" role="img" aria-labelledby="title description">
  <title id="title">KFH Jazeel requirement-gathering questionnaire</title>
  <desc id="description">A clean stakeholder questionnaire covering identity, redesign goals, audience, important existing features and competitors.</desc>
  <rect width="1756" height="1772" fill="#ffffff"></rect>
  <rect x="18" y="18" width="1720" height="1736" rx="48" fill="#ffffff" stroke="#deddd9" stroke-width="2"></rect>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="104" y="92" width="54" height="6" rx="3" fill="#cf3f30"></rect>
    <text x="104" y="148" fill="#cf3f30" font-size="24" font-weight="700" letter-spacing="5">REQUIREMENT GATHERING</text>
    <text x="104" y="205" fill="#090909" font-size="44" font-weight="700">Stakeholder questionnaire</text>

    <g>
      <text x="104" y="304" fill="#cf3f30" font-size="24" font-weight="700" letter-spacing="3">01</text>
      <text x="176" y="304" fill="#171717" font-size="38" font-weight="650">Who are you?</text>
      <rect x="104" y="346" width="1548" height="144" rx="22" fill="#f6f6f4" stroke="#deddd9" stroke-width="2"></rect>
      <line x1="148" y1="445" x2="1608" y2="445" stroke="#d7d6d2" stroke-width="2"></line>
    </g>

    <g>
      <text x="104" y="578" fill="#cf3f30" font-size="24" font-weight="700" letter-spacing="3">02</text>
      <text x="176" y="578" fill="#171717" font-size="38" font-weight="650">Why do you need redesign the mobile application?</text>
      <rect x="104" y="620" width="1548" height="170" rx="22" fill="#f6f6f4" stroke="#deddd9" stroke-width="2"></rect>
      <line x1="148" y1="742" x2="1608" y2="742" stroke="#d7d6d2" stroke-width="2"></line>
    </g>

    <g>
      <text x="104" y="878" fill="#cf3f30" font-size="24" font-weight="700" letter-spacing="3">03</text>
      <text x="176" y="878" fill="#171717" font-size="38" font-weight="650">Who is your key audience?</text>
      <rect x="104" y="920" width="1548" height="144" rx="22" fill="#f6f6f4" stroke="#deddd9" stroke-width="2"></rect>
      <line x1="148" y1="1019" x2="1608" y2="1019" stroke="#d7d6d2" stroke-width="2"></line>
    </g>

    <g>
      <text x="104" y="1152" fill="#cf3f30" font-size="24" font-weight="700" letter-spacing="3">04</text>
      <text x="176" y="1152" fill="#171717" font-size="38" font-weight="650">3 most important freatures in your existing design</text>
      <text x="176" y="1204" fill="#171717" font-size="38" font-weight="650">that you would like to keep?</text>
      <rect x="104" y="1250" width="1548" height="244" rx="22" fill="#f6f6f4" stroke="#deddd9" stroke-width="2"></rect>
      <text x="148" y="1326" fill="#5f5e66" font-size="30" font-weight="650">1</text>
      <line x1="204" y1="1318" x2="1608" y2="1318" stroke="#d7d6d2" stroke-width="2"></line>
      <text x="148" y="1392" fill="#5f5e66" font-size="30" font-weight="650">2</text>
      <line x1="204" y1="1384" x2="1608" y2="1384" stroke="#d7d6d2" stroke-width="2"></line>
      <text x="148" y="1458" fill="#5f5e66" font-size="30" font-weight="650">3</text>
      <line x1="204" y1="1450" x2="1608" y2="1450" stroke="#d7d6d2" stroke-width="2"></line>
    </g>

    <g>
      <text x="104" y="1578" fill="#cf3f30" font-size="24" font-weight="700" letter-spacing="3">05</text>
      <text x="176" y="1578" fill="#171717" font-size="38" font-weight="650">Who are your competitors?</text>
      <rect x="104" y="1620" width="1548" height="92" rx="22" fill="#f6f6f4" stroke="#deddd9" stroke-width="2"></rect>
      <line x1="148" y1="1682" x2="1608" y2="1682" stroke="#d7d6d2" stroke-width="2"></line>
    </g>
  </g>
</svg>